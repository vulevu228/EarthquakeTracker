name: Earthquake Seismic Tracker

# No scheduled trigger here on purpose. Collection for this project runs
# locally (Task Scheduler -> earthquake_tracker.py -> a local PostgreSQL
# instance, every 15 minutes - see README). GitHub's runners can't reach
# 'localhost:5432' on this machine, so a cron trigger here would just fail
# every run. Left as workflow_dispatch in case this ever points at a
# reachable (cloud-hosted) Postgres instead - flip it back on then.
on:
  workflow_dispatch:

jobs:
  track-earthquake-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Earthquake Tracker
        run: python earthquake_tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add earthquake_events.db
          git commit -m "data: log USGS earthquake events" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
